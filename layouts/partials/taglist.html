{{ if .Params.tags }}
<aside style="margin-top: 2rem;">
    <p><small>
    {{ range $key, $value := .Params.tags }}
    <a href="/tags/{{ . | urlize }}" title="Posts tagged with {{ . }}">#{{ . }}</a>{{ if ne $key (sub (len $.Page.Params.tags) 1) }}, {{ end }}
    {{ end }}
    </small></p>
</aside>
{{ end }}
