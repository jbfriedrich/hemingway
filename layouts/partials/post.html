<!-- This is a full post -->
{{ $img := (.Resources.ByType "image").GetMatch "images/feature*" }}
<article>
    <header>
        <hgroup>
            <h1>{{ .Title }}</h1>
            <h2>{{ .Page.Date.Format "January 2, 2006" }}</h2>
        </hgroup>
        {{ if .Params.summary }}
        <p><em>{{ .Params.summary }}</em></p>
        {{ end }}
        {{ partial "post_feature_image.html" . }}
    </header>
    {{ .Content }}
    <footer>
        {{ partial "taglist.html" . }}
    </footer>
</article>
