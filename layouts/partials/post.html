<!-- This is a full post -->
{{ $img := (.Resources.ByType "image").GetMatch "images/feature*" }}
<article>
    <header>
        <p><small>{{ .Page.Date.Format "January 2, 2006" }}</small></p>
        <h1>{{ .Title }}</h1>
        {{ if .Params.summary }}
        <p><em>{{ .Params.summary }}</em></p>
        {{ end }}
        {{ partial "post_feature_image.html" . }}
    </header>
    {{ .Content }}
    {{ partial "taglist.html" . }}
</article>
