<small>
    <nav>
        <ul>
            {{/* Copyright */}}
            <li>&copy; {{ time.Now.Year }} {{ .Site.Params.author.display_name }}</li>
        </ul>
        <ul>
            {{ $currentPage := . }}
            {{/* Footer navigation */}}
            {{ range .Site.Menus.footer }}
            <li>
                <a href="{{ .URL }}"{{if $currentPage.IsMenuCurrent "footer" . }} aria-current="page"{{end}}{{if eq .Identifier "mastodon"}} rel="me"{{end}}>{{ .Name }}</a>
            </li>
            {{ end }}
        </ul>
    </nav>
</small>
