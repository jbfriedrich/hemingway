<header>
    {{- $img := resources.Get "images/author.jpg" -}}
    {{ with $img }}
        {{ $regular := .Resize "80x" }}
        {{ $double := .Resize "160x" }}
        <img srcset="{{ $regular.RelPermalink }} 1x, {{ $double.RelPermalink }} 2x"
             src="{{ $regular.RelPermalink }}"
             alt="Blog logo"
             style="border-radius: var(--pico-border-radius); border: 1px solid var(--pico-muted-color); margin: 0 auto; display: block;"/>
    {{ end }}
    <h1 style="margin-top: 1rem;">{{ .Site.Title }}</h1>
</header>
