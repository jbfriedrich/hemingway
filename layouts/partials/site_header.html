<header>
    <nav>
        <ul>
            <li>
                {{- $img := resources.Get "images/author.jpg" -}}
                {{ with $img }}
                    {{ $regular := .Resize "40x" }}
                    {{ $double := .Resize "80x" }}
                    <strong>
                        <img srcset="{{ $regular.RelPermalink }} 1x, {{ $double.RelPermalink }} 2x"
                             src="{{ $regular.RelPermalink }}"
                             alt="Blog logo"
                             style="width: 40px; height: 40px; border-radius: 50%; vertical-align: middle; margin-right: 0.5rem;"/>{{ $.Site.Title }}
                    </strong>
                {{ end }}
            </li>
        </ul>
        <ul>
            {{ $currentPage := . }}
            {{ range .Site.Menus.main }}
            <li>
                <a href="{{ .URL }}"{{if $currentPage.IsMenuCurrent "main" . }} aria-current="page"{{end}}{{if eq .Identifier "mastodon"}} rel="me"{{end}}>{{ .Name }}</a>
            </li>
            {{ end }}
        </ul>
    </nav>
</header>
