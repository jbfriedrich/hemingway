{{ $img := (.Resources.ByType "image").GetMatch "*feature*" }}
{{if or (.Params.feature_image) ($img) }}
<figure style="margin-bottom: var(--pico-spacing);">
    {{ if .Params.feature_image }}
    <img alt="Feature image" class="feature-image" src="{{ .Params.feature_image }}">
    {{ end }}
    {{ with $img }}
    {{ $regular := .Resize "900x" }}
    {{ $mid := .Resize "1400x" }}
    {{ $big := .Resize "1800x" }}
    <img class="feature-image" style="aspect-ratio: 16/9;"
         srcset="{{ $regular.RelPermalink }},
                 {{ $mid.RelPermalink }} 1.5x,
                 {{ $big.RelPermalink }} 2x"
         alt="Page Feature Image"
         src="{{ $big.RelPermalink }}">
    {{ end }}
</figure>
{{ end }}
